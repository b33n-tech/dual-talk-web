<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0f0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bridge">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>Bridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #0f0f0f;
    --paper: #f5f2ec;
    --paper2: #ede9e0;
    --accent: #c8390a;
    --text-muted: #7a7468;
    --border: rgba(0,0,0,0.12);
    --border-strong: rgba(0,0,0,0.25);
    --font: 'IBM Plex Sans', sans-serif;
    --mono: 'IBM Plex Mono', monospace;
    --radius: 4px;
    --zone-b-bg: #1a1a18;
    --zone-b-text: #f0ece2;
    --zone-b-muted: #8a8679;
    --zone-b-border: rgba(255,255,255,0.1);
    --header-h: 48px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  html, body {
    height: 100%; height: 100dvh;
    overflow: hidden;
    font-family: var(--font);
    background: var(--ink);
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }

  /* ── HEADER ── */
  #header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: calc(var(--header-h) + var(--safe-top));
    padding-top: var(--safe-top);
    padding-left: 14px; padding-right: 14px;
    background: var(--ink);
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 10px; padding-bottom: 6px;
  }
  .logo {
    font-family: var(--mono); font-weight: 500;
    color: var(--accent); font-size: 14px; letter-spacing: 0.06em;
    flex-shrink: 0; padding-bottom: 2px;
  }
  .script-label {
    font-size: 11px; color: rgba(255,255,255,0.38);
    font-family: var(--mono);
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    text-align: center; padding-bottom: 2px;
  }
  .header-actions { display: flex; gap: 6px; flex-shrink: 0; }

  .hdr-btn {
    background: rgba(255,255,255,0.08);
    border: 0.5px solid rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.65);
    border-radius: var(--radius);
    padding: 5px 10px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.03em;
    cursor: pointer; transition: all 0.15s;
    -webkit-appearance: none; white-space: nowrap;
  }
  .hdr-btn:active { background: rgba(255,255,255,0.18); color: #fff; }
  @media (hover: hover) { .hdr-btn:hover { background: rgba(255,255,255,0.15); color: #fff; } }
  .hdr-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .hdr-btn.primary:active { background: #a82e08; }

  input[type="file"] { display: none; }

  /* ── MAIN ── */
  #app {
    display: flex; flex-direction: column;
    height: 100dvh;
    padding-top: calc(var(--header-h) + var(--safe-top));
  }

  #view-exchange {
    display: flex; flex-direction: column;
    flex: 1; overflow: hidden;
    min-height: 0;
  }

  /* ── ZONE B (interlocuteur — haut, retourné) ── */
  .zone-b {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
    background: var(--zone-b-bg); color: var(--zone-b-text);
    transform: rotate(180deg);
    overflow: hidden;
  }
  .zone-b .zc {
    display: flex; flex-direction: column;
    height: 100%; padding: 10px 12px 10px;
  }
  .zone-label-b {
    font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--zone-b-muted); font-family: var(--mono);
    margin-bottom: 6px; flex-shrink: 0;
  }
  .hist-b {
    flex: 1; min-height: 0; overflow-y: auto;
    display: flex; flex-direction: column; gap: 5px;
    padding-bottom: 6px;
  }
  .zone-b .bubble {
    background: rgba(255,255,255,0.07);
    border: 0.5px solid var(--zone-b-border);
    border-radius: var(--radius);
    padding: 8px 12px;
    font-size: 15px; line-height: 1.5;
    max-width: 92%; align-self: flex-start;
  }
  .zone-b .bubble.new {
    background: rgba(200,57,10,0.2);
    border-color: rgba(200,57,10,0.4);
    animation: fadeUp 0.25s ease;
  }
  .responses-area {
    flex-shrink: 0;
    display: flex; flex-direction: column; gap: 5px;
    padding-top: 8px;
    border-top: 0.5px solid var(--zone-b-border);
  }
  .resp-label {
    font-size: 9px; color: var(--zone-b-muted);
    letter-spacing: 0.12em; text-transform: uppercase;
    font-family: var(--mono); margin-bottom: 2px;
  }
  .resp-btn {
    background: rgba(255,255,255,0.06);
    border: 0.5px solid var(--zone-b-border);
    color: var(--zone-b-text);
    padding: 10px 14px; border-radius: var(--radius);
    font-family: var(--font); font-size: 14px; line-height: 1.4;
    cursor: pointer; text-align: right;
    transition: background 0.12s;
    -webkit-appearance: none;
  }
  .resp-btn:active { background: rgba(255,255,255,0.16); }
  @media (hover: hover) { .resp-btn:hover { background: rgba(255,255,255,0.12); } }

  /* ── DIVIDER ── */
  .zone-divider { height: 2px; background: var(--ink); flex-shrink: 0; z-index: 5; }

  /* ── ZONE A (utilisateur — bas) ── */
  .zone-a {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
    background: var(--paper); overflow: hidden;
    padding-bottom: var(--safe-bottom);
  }
  .zone-a .zc {
    display: flex; flex-direction: column;
    height: 100%; padding: 10px 12px 10px;
  }
  .zone-label-a {
    font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--text-muted); font-family: var(--mono);
    margin-bottom: 6px; flex-shrink: 0;
  }
  .hist-a {
    flex: 1; min-height: 0; overflow-y: auto;
    display: flex; flex-direction: column; gap: 5px;
    padding-bottom: 6px;
  }
  .zone-a .bubble {
    background: #fff; border: 0.5px solid var(--border);
    border-radius: var(--radius); padding: 8px 12px;
    font-size: 15px; line-height: 1.5;
    max-width: 92%; align-self: flex-end;
  }
  .zone-a .bubble.sent { background: var(--accent); color: #fff; border-color: transparent; }
  .zone-a .bubble.received { align-self: flex-start; background: var(--paper2); }

  .phrases-area {
    flex-shrink: 0;
    display: flex; flex-direction: column; gap: 6px;
    padding-top: 8px; border-top: 1px solid var(--border);
    max-height: 50%; overflow-y: auto;
  }
  .phrase-btn {
    background: #fff; border: 1px solid var(--border-strong);
    color: var(--ink); padding: 11px 14px; border-radius: var(--radius);
    font-family: var(--font); font-size: 14px; line-height: 1.4;
    cursor: pointer; text-align: left;
    transition: background 0.12s, color 0.12s;
    -webkit-appearance: none;
  }
  .phrase-btn:active { background: var(--accent); color: #fff; border-color: var(--accent); }
  @media (hover: hover) { .phrase-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); } }

  /* ── STATES ── */
  .state-msg {
    padding: 14px 12px; text-align: center;
    font-size: 13px; color: var(--text-muted); font-style: italic;
  }
  .state-end { font-style: normal; }
  .restart-btn {
    display: inline-block; margin-top: 8px; padding: 7px 18px;
    border: 1px solid var(--border-strong); border-radius: var(--radius);
    background: none; cursor: pointer; font-family: var(--font); font-size: 13px;
    color: var(--ink); -webkit-appearance: none; transition: all 0.15s;
  }
  .restart-btn:active { background: var(--ink); color: #fff; }

  /* ── NO SCRIPT ── */
  .no-script {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px; padding: 28px 24px; text-align: center;
    background: var(--paper);
  }
  .no-script .ns-glyph { font-size: 36px; opacity: 0.2; line-height: 1; }
  .no-script .ns-title { font-size: 15px; font-weight: 500; color: var(--ink); }
  .no-script .ns-sub { font-size: 13px; color: var(--text-muted); line-height: 1.5; max-width: 220px; }
  .ns-cta {
    padding: 10px 22px; background: var(--accent); color: #fff;
    border: none; border-radius: var(--radius);
    font-family: var(--font); font-size: 14px; font-weight: 500;
    cursor: pointer; -webkit-appearance: none;
  }
  .ns-cta:active { background: #a82e08; }

  /* ── MODAL ── */
  #modal {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.6);
    align-items: center; justify-content: center;
  }
  #modal.open { display: flex; }
  .modal-box {
    background: var(--paper); border-radius: 8px;
    padding: 24px 20px; max-width: 280px; width: 88%;
    text-align: center;
  }
  .modal-box .mt { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
  .modal-box .ms { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.4; }
  .modal-actions { display: flex; gap: 8px; }
  .mbtn {
    flex: 1; padding: 10px; border-radius: var(--radius);
    font-family: var(--font); font-size: 13px; cursor: pointer;
    border: 1px solid var(--border-strong); background: #fff; color: var(--ink);
    -webkit-appearance: none; transition: opacity 0.15s;
  }
  .mbtn:active { opacity: 0.75; }
  .mbtn.danger { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* ── TOAST ── */
  #toast {
    position: fixed; bottom: calc(16px + var(--safe-bottom));
    left: 50%; transform: translateX(-50%) translateY(70px);
    background: var(--ink); color: #fff;
    padding: 7px 16px; border-radius: 20px;
    font-size: 12px; font-family: var(--mono); z-index: 999;
    transition: transform 0.28s cubic-bezier(0.34,1.56,0.64,1);
    pointer-events: none; white-space: nowrap;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  /* ── ANIMS ── */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 2px; }
</style>
</head>
<body>

<div id="header">
  <span class="logo">BRIDGE</span>
  <span class="script-label" id="lbl-script">aucun script</span>
  <div class="header-actions">
    <button class="hdr-btn" id="btn-restart" style="display:none" onclick="confirmRestart()">↺</button>
    <button class="hdr-btn primary" onclick="document.getElementById('import-file').click()">↑ script</button>
    <input type="file" id="import-file" accept=".json" onchange="importScript(event)">
  </div>
</div>

<div id="app">
  <div id="view-exchange"></div>
</div>

<div id="toast"></div>

<div id="modal">
  <div class="modal-box">
    <div class="mt">Recommencer ?</div>
    <div class="ms">L'échange en cours sera effacé.</div>
    <div class="modal-actions">
      <button class="mbtn" onclick="closeModal()">Annuler</button>
      <button class="mbtn danger" onclick="doRestart()">Recommencer</button>
    </div>
  </div>
</div>

<script>
// ── STATE ──
let script = null;
let nodeId = null;
let state = 'idle'; // idle | waiting | end

// ── TOAST ──
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2200);
}

// ── MODAL ──
function confirmRestart() {
  document.getElementById('modal').classList.add('open');
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
}
function doRestart() {
  closeModal();
  restartExchange();
}

// ── IMPORT ──
function importScript(evt) {
  const file = evt.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.nodes || !data.startNode) { toast('Format invalide'); return; }
      script = data;
      script._name = file.name.replace('.json', '');
      nodeId = script.startNode;
      state = 'idle';
      document.getElementById('lbl-script').textContent = script._name;
      document.getElementById('btn-restart').style.display = '';
      try { localStorage.setItem('bridge_script', JSON.stringify(script)); } catch(e) {}
      render();
      toast('Script chargé ✓');
    } catch(err) { toast('Erreur JSON'); }
  };
  reader.readAsText(file);
  evt.target.value = '';
}

// ── RENDER ──
function render() {
  const view = document.getElementById('view-exchange');
  view.innerHTML = '';

  if (!script) {
    const ns = document.createElement('div');
    ns.className = 'no-script';
    ns.innerHTML = `
      <div class="ns-glyph">⇅</div>
      <div class="ns-title">Aucun script chargé</div>
      <div class="ns-sub">Importez un fichier .json pour démarrer l'échange bilingue.</div>
      <button class="ns-cta" onclick="document.getElementById('import-file').click()">↑ Importer un script</button>`;
    view.appendChild(ns);
    return;
  }

  view.innerHTML = `
    <div class="zone-b">
      <div class="zc">
        <div class="zone-label-b">interlocuteur · دری</div>
        <div class="hist-b" id="hist-b"></div>
        <div class="responses-area" id="resp-area" style="display:none">
          <div class="resp-label">réponses</div>
          <div id="resp-btns"></div>
        </div>
      </div>
    </div>
    <div class="zone-divider"></div>
    <div class="zone-a">
      <div class="zc">
        <div class="zone-label-a">vous · français</div>
        <div class="hist-a" id="hist-a"></div>
        <div class="phrases-area" id="phrases"></div>
      </div>
    </div>`;

  renderNode();
}

function renderNode() {
  const phrases = document.getElementById('phrases');
  if (!phrases) return;
  phrases.innerHTML = '';

  if (state === 'waiting') {
    phrases.innerHTML = `<div class="state-msg">En attente de la réponse…</div>`;
    return;
  }
  if (state === 'end') {
    phrases.innerHTML = `<div class="state-msg state-end">Fin de l'échange.<br><button class="restart-btn" onclick="restartExchange()">Recommencer</button></div>`;
    return;
  }

  const node = script.nodes[nodeId];
  if (!node) return;

  const btn = document.createElement('button');
  btn.className = 'phrase-btn';
  btn.textContent = node.textFr || '(vide)';
  btn.onclick = () => sendPhrase(node);
  phrases.appendChild(btn);

  const ra = document.getElementById('resp-area');
  if (ra) ra.style.display = 'none';
}

function sendPhrase(node) {
  addMsg('a', node.textFr, 'sent');
  addMsg('b', node.textDari || node.textFr, 'new');

  state = 'waiting';
  const phrases = document.getElementById('phrases');
  if (phrases) phrases.innerHTML = `<div class="state-msg">En attente de la réponse…</div>`;

  const ra = document.getElementById('resp-area');
  const rb = document.getElementById('resp-btns');
  if (!rb) return;
  rb.innerHTML = '';

  if (!node.responses || node.responses.length === 0) {
    state = 'end';
    if (phrases) phrases.innerHTML = `<div class="state-msg state-end">Fin de l'échange.<br><button class="restart-btn" onclick="restartExchange()">Recommencer</button></div>`;
    return;
  }

  if (ra) ra.style.display = '';
  node.responses.forEach(resp => {
    const b = document.createElement('button');
    b.className = 'resp-btn';
    b.textContent = resp.labelDari || resp.labelFr || '…';
    b.onclick = () => selectResponse(resp);
    rb.appendChild(b);
  });
}

function selectResponse(resp) {
  addMsg('b', resp.labelDari || resp.labelFr, '');
  addMsg('a', resp.labelFr || resp.labelDari, 'received');

  const ra = document.getElementById('resp-area');
  const rb = document.getElementById('resp-btns');
  if (rb) rb.innerHTML = '';
  if (ra) ra.style.display = 'none';

  if (resp.nextNode && script.nodes[resp.nextNode]) {
    nodeId = resp.nextNode;
    state = 'idle';
    renderNode();
  } else {
    state = 'end';
    const phrases = document.getElementById('phrases');
    if (phrases) phrases.innerHTML = `<div class="state-msg state-end">Fin de l'échange.<br><button class="restart-btn" onclick="restartExchange()">Recommencer</button></div>`;
  }
}

function addMsg(zone, text, cls) {
  const hist = document.getElementById('hist-' + zone);
  if (!hist || !text) return;
  const d = document.createElement('div');
  d.className = 'bubble' + (cls ? ' ' + cls : '');
  d.textContent = text;
  hist.appendChild(d);
  hist.scrollTop = hist.scrollHeight;
}

function restartExchange() {
  if (!script) return;
  nodeId = script.startNode;
  state = 'idle';
  render();
}

// ── INIT ──
(function init() {
  try {
    const raw = localStorage.getItem('bridge_script');
    if (raw) {
      const data = JSON.parse(raw);
      if (data.nodes && data.startNode) {
        script = data;
        nodeId = script.startNode;
        state = 'idle';
        document.getElementById('lbl-script').textContent = script._name || 'script';
        document.getElementById('btn-restart').style.display = '';
      }
    }
  } catch(e) {}
  render();
})();

// ── SERVICE WORKER ──
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(() => console.log('SW registered'))
      .catch(err => console.warn('SW failed:', err));
  });
}
</script>
</body>
</html>
